name: Build Pacman Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      promote:
        description: Sign and publish this exact repository commit
        required: true
        default: false
        type: boolean

concurrency:
  group: sisyphus-pacman-repo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-packages:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build environment
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm
          pacman -S --noconfirm cargo curl gcc-fortran git meson patch rpm-tools rust
          if [[ ! -s /etc/machine-id ]]; then
            tr -d '-' </proc/sys/kernel/random/boot_id >/etc/machine-id
          fi
          useradd -m builduser
          printf 'builduser ALL=(ALL) NOPASSWD: /usr/bin/pacman\n' >> /etc/sudoers
          chown -R builduser:builduser .

      - name: Validate package metadata
        shell: bash
        run: |
          set -euo pipefail
          runuser -u builduser -- bash -c '
            set -euo pipefail
            for pkg in blerust ccze-rs elan-guardian iwchaos libinput-rs tuned-rs; do
              (
                cd "$pkg"
                diff -u .SRCINFO <(makepkg --printsrcinfo)
                source PKGBUILD
                [[ $_commit =~ ^[0-9a-f]{40}$ ]]
              )
            done
          '

      - name: Validate native cutover manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/audit-systemd-closure.py
          grep -Ev '^[[:space:]]*(#|$)' native-cutover-packages.txt |
            LC_ALL=C sort -cu
          test "$(grep -Evc '^[[:space:]]*(#|$)' native-cutover-packages.txt)" -gt 0

      - name: Build packages
        shell: bash
        run: |
          runuser -u builduser -- bash -c '
            set -euo pipefail
            git config --global --add safe.directory "*"
            mkdir -p x86_64
            for pkg in blerust ccze-rs elan-guardian iwchaos libinput-rs tuned-rs; do
              cd "$pkg"
              mapfile -t artifacts < <(makepkg --packagelist)
              makepkg -s --noconfirm --cleanbuild --clean
              for artifact in "${artifacts[@]}"; do
                test -f "$artifact"
                cp "$artifact" ../x86_64/
              done
              cd ..
            done
          '

      - name: Upload unsigned packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pacman-packages-${{ github.sha }}
          path: x86_64/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

  promote:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote }}
    needs: build-packages
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Download exact build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: pacman-packages-${{ github.sha }}
          path: public/x86_64

      - name: Import release signing authority
        env:
          REPOSITORY_SIGNING_KEY: ${{ secrets.SISYPHUS_REPOSITORY_SIGNING_KEY }}
          REPOSITORY_SIGNING_PASSPHRASE: ${{ secrets.SISYPHUS_REPOSITORY_SIGNING_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm
          pacman -S --noconfirm gnupg pacman-contrib
          test -n "$REPOSITORY_SIGNING_KEY"
          test -n "$REPOSITORY_SIGNING_PASSPHRASE"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$REPOSITORY_SIGNING_KEY" | base64 --decode | gpg --batch --import
          printf 'pinentry-mode loopback\n' > "$GNUPGHOME/gpg.conf"
          printf 'allow-loopback-pinentry\n' > "$GNUPGHOME/gpg-agent.conf"
          gpgconf --kill gpg-agent
          mapfile -t fingerprints < <(
            gpg --batch --with-colons --list-secret-keys |
              awk -F: '$1 == "sec" { primary = 1; next } primary && $1 == "fpr" { print $10; primary = 0 }'
          )
          test "${#fingerprints[@]}" -eq 1
          test "${fingerprints[0]}" = 2A02745D8C2C03AE7F95BCEA8136EB9238213447
          {
            echo "GNUPGHOME=$GNUPGHOME"
            echo "SISYPHUS_SIGNING_FINGERPRINT=${fingerprints[0]}"
          } >> "$GITHUB_ENV"

      - name: Sign and index immutable snapshot
        env:
          REPOSITORY_SIGNING_PASSPHRASE: ${{ secrets.SISYPHUS_REPOSITORY_SIGNING_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          cd public/x86_64
          sign_detached() {
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 3 \
              --local-user "$SISYPHUS_SIGNING_FINGERPRINT" \
              --detach-sign "$1" 3<<<"$REPOSITORY_SIGNING_PASSPHRASE"
          }
          for artifact in ./*.pkg.tar.zst; do
            sign_detached "$artifact"
          done
          repo-add sisyphus.db.tar.gz ./*.pkg.tar.zst
          sign_detached sisyphus.db.tar.gz
          ln -sfn sisyphus.db.tar.gz sisyphus.db
          ln -sfn sisyphus.db.tar.gz.sig sisyphus.db.sig
          for artifact in ./*.pkg.tar.zst sisyphus.db.tar.gz; do
            gpg --batch --verify "$artifact.sig" "$artifact"
          done
          snapshot="sisyphus-snapshot-${GITHUB_SHA}.sha256"
          {
            printf 'source_commit=%s\n' "$GITHUB_SHA"
            printf 'workflow_run=%s\n' "$GITHUB_RUN_ID"
            printf 'workflow_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            sha256sum ./*.pkg.tar.zst ./*.pkg.tar.zst.sig \
              sisyphus.db.tar.gz sisyphus.db.tar.gz.sig
          } > "$snapshot"
          sign_detached "$snapshot"
          gpg --batch --verify "$snapshot.sig" "$snapshot"

      - name: Remove signing authority
        if: ${{ always() }}
        shell: bash
        run: |
          gpgconf --homedir "$RUNNER_TEMP/gnupg" --kill all || true
          rm -rf "$RUNNER_TEMP/gnupg"

      - name: Upload signed snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pacman-repo-${{ github.sha }}
          path: public/
          if-no-files-found: error
          retention-days: 30

  deploy-pages:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote }}
    needs: promote
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout published snapshots
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: previous-pages

      - name: Download signed snapshot
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: pacman-repo-${{ github.sha }}
          path: public

      - name: Preserve immutable repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          snapshot="sisyphus-snapshot-${GITHUB_SHA}.sha256"
          test -s "public/x86_64/$snapshot"
          test -s "public/x86_64/$snapshot.sig"
          test ! -e "previous-pages/snapshots/$GITHUB_SHA"
          if [ -d previous-pages/snapshots ]; then
            mkdir -p public/snapshots
            cp -a previous-pages/snapshots/. public/snapshots/
          fi
          mkdir -p "public/snapshots/$GITHUB_SHA"
          cp -a public/x86_64/. "public/snapshots/$GITHUB_SHA/"

      - name: Deploy promoted snapshot
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          user_name: Sisyphus Aeolides
          user_email: SisyphusAeolides@pm.me
          commit_message: Publish certified Sisyphus pacman repository
