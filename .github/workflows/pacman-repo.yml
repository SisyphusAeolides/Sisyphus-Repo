name: Build and Publish Pacman Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sisyphus-pacman-repo
  cancel-in-progress: false

jobs:
  build-packages:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          pacman -Syu --noconfirm
          # Install general dependencies we know we need
          pacman -S --noconfirm sudo git gcc-fortran meson curl patch rust cargo
          useradd -m builduser
          echo 'builduser ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builduser
          chown -R builduser:builduser .

      - name: Build PKGBUILDs
        run: |
          sudo -u builduser bash -c '
            set -euo pipefail
            git config --global --add safe.directory "*"
            mkdir -p x86_64
            
            for pkg in ccze-rs elan-guardian libinput-rs tuned-rs; do
              cd $pkg
              mapfile -t artifacts < <(makepkg --packagelist)
              makepkg -s --noconfirm --cleanbuild --clean
              for artifact in "${artifacts[@]}"; do
                test -f "$artifact"
                cp "$artifact" ../x86_64/
              done
              cd ..
            done
            
            cd x86_64
            test -n "$(find . -maxdepth 1 -name "*.pkg.tar.zst" -print -quit)"
            repo-add sisyphus.db.tar.gz ./*.pkg.tar.zst
          '

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pacman-repo
          path: x86_64/
          if-no-files-found: error

  deploy-pages:
    needs: build-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: pacman-repo
          path: public/x86_64
          merge-multiple: true
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          user_name: Sisyphus Aeolides
          user_email: SisyphusAeolides@pm.me
          commit_message: Publish Sisyphus pacman repository
