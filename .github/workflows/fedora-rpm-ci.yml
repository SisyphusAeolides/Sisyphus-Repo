name: Fedora RPM Build (Default)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-rpms:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rpm-build
        run: dnf install -y rpm-build rpmdevtools dnf-plugins-core
      - name: Build RPMs
        run: |
          for spec in $(find . -name "*.spec"); do
            dnf builddep -y "$spec" || true
            rpmbuild -ba "$spec" --define "_topdir $PWD/rpmbuild" || true
          done
