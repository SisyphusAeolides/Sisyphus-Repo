name: Build and Publish Pacman Packages

permissions:
  contents: write

concurrency:
  group: sisyphus-repository-publish
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/PKGBUILD'

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install Git for checkout
        shell: bash
        run: |
          pacman -Syu --noconfirm git

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Arch Linux environment
        shell: bash
        run: |
          pacman -Syu --noconfirm base-devel git gnupg sudo rsync
          useradd --create-home --user-group builduser
          echo "builduser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          install -d -o builduser -g builduser "$GITHUB_WORKSPACE/x86_64"
          chown -R builduser:builduser "$GITHUB_WORKSPACE/x86_64"

      - name: Setup GPG
        id: gpg
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY is not configured for this repository."
            exit 1
          fi
          printf '%s\n' "$GPG_PRIVATE_KEY" |
            sudo -u builduser env HOME=/home/builduser gpg --batch --import
          repo_key=$(sudo -u builduser env HOME=/home/builduser \
            gpg --batch --with-colons --list-secret-keys |
            awk -F: '$1 == "fpr" { print $10; exit }')
          if [ -z "$repo_key" ]; then
            echo "::error::The configured GPG_PRIVATE_KEY contains no secret signing key."
            exit 1
          fi
          echo "key_id=$repo_key" >> "$GITHUB_OUTPUT"

      - name: Build Packages and Update Repo
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ "${GITHUB_EVENT_NAME:-push}" = "workflow_dispatch" ]; then
            changed_pkgbuilds=$(git -c safe.directory="$GITHUB_WORKSPACE" ls-files -- '*PKGBUILD')
          else
            changed_pkgbuilds=$(git -c safe.directory="$GITHUB_WORKSPACE" diff-tree --no-commit-id --name-only -r HEAD -- '*PKGBUILD')
          fi
          if [ -z "$changed_pkgbuilds" ]; then
            echo "No PKGBUILD changes detected."
            exit 0
          fi

          while IFS= read -r pkgbuild; do
            [ -n "$pkgbuild" ] || continue
            [ -f "$GITHUB_WORKSPACE/$pkgbuild" ] || continue
            pkgdir=$(dirname "$pkgbuild")
            chown -R builduser:builduser "$GITHUB_WORKSPACE/$pkgdir"
          done <<< "$changed_pkgbuilds"

          sudo -u builduser env HOME=/home/builduser GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            CHANGED_PKGBUILDS="$changed_pkgbuilds" bash -c '
            set -e
            while IFS= read -r pkgbuild; do
              [ -n "$pkgbuild" ] || continue
              [ -f "$GITHUB_WORKSPACE/$pkgbuild" ] || continue
              pkgdir=$(dirname "$pkgbuild")
              cd "$pkgdir"
              PKGDEST="$GITHUB_WORKSPACE/x86_64" \
                makepkg --syncdeps --noconfirm --sign --key "${{ steps.gpg.outputs.key_id }}" --force
              cd "$GITHUB_WORKSPACE"
            done <<< "$CHANGED_PKGBUILDS"

            cd "$GITHUB_WORKSPACE/x86_64"
            # Existing archives may have been signed by a retired key. Keep
            # the old public key available for consumers, but ensure every
            # archive in the live repository can be checked with the active
            # deployment key.
            for package in ./*.pkg.tar.zst; do
              [ -f "$package" ] || continue
              if ! gpg --batch --verify "$package.sig" "$package" >/dev/null 2>&1; then
                gpg --batch --yes --detach-sign \
                  --local-user "${{ steps.gpg.outputs.key_id }}" "$package"
              fi
            done

            # Reindex every archive, including a package rebuilt at the same
            # version.  --new leaves an older checksum in the database when
            # makepkg --force replaces an archive, which makes pacman reject
            # the freshly published file as corrupted.
            repo-add --sign --key "${{ steps.gpg.outputs.key_id }}" \
              sisyphus.db.tar.gz ./*.pkg.tar.zst

            # Keep the short database names as regular files so simple HTTP
            # hosts such as raw.githubusercontent.com serve their contents.
            cp --remove-destination sisyphus.db.tar.gz sisyphus.db
            cp --remove-destination sisyphus.db.tar.gz.sig sisyphus.db.sig
            cp --remove-destination sisyphus.files.tar.gz sisyphus.files
            cp --remove-destination sisyphus.files.tar.gz.sig sisyphus.files.sig
          ' </dev/null

      - name: Commit and Push
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git -c safe.directory="$GITHUB_WORKSPACE" add -- x86_64/
          if git -c safe.directory="$GITHUB_WORKSPACE" diff --cached --quiet; then
            echo "Repository database is already current."
            exit 0
          fi

          git -c safe.directory="$GITHUB_WORKSPACE" \
            -c user.name="Kenny Glauner" \
            -c user.email="SisyphusAeolides@pm.me" \
            -c commit.gpgsign=false \
            commit -m "chore: auto-update repository database"
          git -c safe.directory="$GITHUB_WORKSPACE" push origin "HEAD:${GITHUB_REF_NAME:-main}"
