# RustD alternate-boot entry for side-by-side certification.
# Consumed by /usr/lib/rustd/boot/rustd-configure-boot.
#
# Creates a bootloader entry that launches the same kernel/initramfs as the
# default systemd entry, but with init=/usr/lib/rustd/rustd. The stock systemd
# entry is left untouched as the offline rollback path.

title=RustD (certification)
init=/usr/lib/rustd/rustd
options=rustd.unit=default.target
