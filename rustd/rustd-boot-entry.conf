# Exclusive RustD boot configuration.
# Consumed by /usr/lib/rustd/boot/rustd-configure-boot.
#
# Rewrites the primary bootloader entry so the installed kernel/initramfs
# launches init=/usr/lib/rustd/rustd. Keep a CachyOS rescue USB until the first
# graphical boot on RustD succeeds.

title=RustD
init=/usr/lib/rustd/rustd
options=rustd.unit=default.target
